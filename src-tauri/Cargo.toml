[package]
name = "romp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Romp — Tauri shell for the oh-my-pi coding agent"

[lib]
name = "romp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }
embed-resource = "3"

[dependencies]
omp-core = { path = "../crates/omp-core" }
omp-session = { path = "../crates/omp-session" }
omp-rpc = { path = "../crates/omp-rpc" }
omp-agent = { path = "../crates/omp-agent" }
omp-stats = { path = "../crates/omp-stats" }
omp-scheduler = { path = "../crates/omp-scheduler" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tauri = { workspace = true, features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading"] }
